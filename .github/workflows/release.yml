name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yavot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: morphe-patches-yavot
          fetch-depth: 0

      - name: Checkout base morphe-patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MorpheApp/morphe-patches
          # Official v1.40.0-dev.1; immutable compatibility target documented in COMPATIBILITY.md.
          ref: 0b2ac378feb6b64fb7f1125abdccb0ff7d9125ff
          path: morphe-patches

      - name: Checkout morphe-patcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MorpheApp/morphe-patcher
          ref: 026b0b762932ff13cb7923d713c6482fe73d24d6
          path: morphe-patcher

      - name: Checkout morphe-patches-library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: 0c2d15c76ee12cb1d8917fc108c424c2bfd1ffc0
          path: morphe-patches-library

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      - name: Install npm dependencies
        working-directory: morphe-patches-yavot
        run: npm install

      # Populate base's intermediates dirs that the yavot extension compileOnly's against.
      # Only the extension classes are needed, the patch code of yavot is independent of base.
      - name: Precompile base morphe-patches extension classes
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseKotlin \
                    :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace

      - name: Release
        working-directory: morphe-patches-yavot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
